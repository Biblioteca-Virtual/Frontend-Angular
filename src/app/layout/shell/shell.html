<header class="vl-navbar-wrapper">
  <nav class="vl-pill-nav" aria-label="Navegación principal">
    <a
      class="vl-pill"
      routerLink="/"
      routerLinkActive="vl-pill--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Home
    </a>

    @if (!auth.isLoggedIn()) {
      <a class="vl-pill" routerLink="/login" routerLinkActive="vl-pill--active">
        Login
      </a>
      <a class="vl-pill" routerLink="/registro" routerLinkActive="vl-pill--active">
        Registrarse
      </a>
    }

    <a class="vl-pill" routerLink="/libros" routerLinkActive="vl-pill--active">
      Biblioteca
    </a>

    @if (auth.isLoggedIn()) {
      <a class="vl-pill" routerLink="/ruleta" routerLinkActive="vl-pill--active">
        Ruleta
      </a>
      <button type="button" class="vl-pill vl-pill--btn" (click)="logout()" title="Cerrar sesión">
        Salir ({{ auth.displayName() || 'Usuario' }})
      </button>
    }
  </nav>
</header>

<main class="vl-content-container">
  <router-outlet />
</main>
