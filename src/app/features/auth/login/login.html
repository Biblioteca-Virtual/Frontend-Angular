<div class="vl-page-layout">
  <div class="vl-title-row">
    <h1 class="vl-highlight-title">Login</h1>
  </div>

  <div class="vl-content-grid">
    <!-- Left Column: Form Card + Folder Actions -->
    <div class="vl-form-col">
      <div class="vl-panel auth-panel">
        <div class="auth-panel__header">
          <a routerLink="/" class="vl-back-title">
            <svg viewBox="0 0 24 24">
              <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>Login</span>
          </a>

          <div class="auth-panel__icons" aria-hidden="true">
            <!-- Share Icon -->
            <button type="button" class="icon-btn" aria-label="Compartir">
              <svg viewBox="0 0 24 24" fill="none" stroke="#d4973b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" />
                <polyline points="16 6 12 2 8 6" />
                <line x1="12" y1="2" x2="12" y2="15" />
              </svg>
            </button>
            <!-- 3 Dots Icon -->
            <button type="button" class="icon-btn" aria-label="Más opciones">
              <svg viewBox="0 0 24 24" fill="#d4973b">
                <circle cx="12" cy="12" r="2" />
                <circle cx="19" cy="12" r="2" />
                <circle cx="5" cy="12" r="2" />
              </svg>
            </button>
          </div>
        </div>

        <bv-error-banner [error]="error()" />

        <form id="loginForm" [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <div class="vl-field">
            <label for="email">Correo electronico:</label>
            <div class="vl-input-wrap">
              <svg class="vl-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                <polyline points="22 4 12 14.01 9 11.01" />
              </svg>
              <input
                id="email"
                type="email"
                formControlName="email"
                placeholder="Ingrese correo electronico"
                autocomplete="email"
                required
              />
            </div>
            @if (email().touched && email().hasError('required')) {
              <small class="auth__hint-error">El correo es obligatorio.</small>
            } @else if (email().touched && email().hasError('email')) {
              <small class="auth__hint-error">El correo no tiene un formato válido.</small>
            }
          </div>

          <div class="vl-field">
            <label for="password">Contraseña:</label>
            <div class="vl-input-wrap">
              <svg class="vl-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                <polyline points="22 4 12 14.01 9 11.01" />
              </svg>
              <input
                id="password"
                type="password"
                formControlName="password"
                placeholder="Ingrese Contraseña"
                autocomplete="current-password"
                required
              />
            </div>
            @if (password().touched && password().hasError('required')) {
              <small class="auth__hint-error">La contraseña es obligatoria.</small>
            }
          </div>
        </form>
      </div>

      <!-- Blue Folder Action Buttons underneath card -->
      <div class="vl-folder-actions">
        <bv-folder-button
          label="Login"
          type="submit"
          [disabled]="submitting()"
          (clicked)="submit()"
        />
        <bv-folder-button
          label="Registrarse"
          routerLink="/registro"
        />
        <bv-folder-button
          label="Cancelar"
          routerLink="/"
        />
      </div>
    </div>

    <!-- Right Column: Window Card with Login.jpg -->
    <div class="vl-image-col">
      <bv-window-card
        title="slay.png"
        src="/assets/images/Login.jpg"
        alt="Login Biblioteca"
      />
    </div>
  </div>
</div>
