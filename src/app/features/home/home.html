<section class="home-container">
  <!-- Left Side: biblioteca.png window card -->
  <div class="home-card-col home-card-col--left">
    <bv-window-card
      title="biblioteca.png"
      src="/assets/images/Biblioteca.jpg"
      alt="Biblioteca Virtual"
      routerLink="/libros"
    />
  </div>

  <!-- Center: Hero Brand & Slogan -->
  <div class="home-hero">
    <h1 class="hero-brand">
      <span class="hero-brand__virtual">Virtual</span>
      <span class="hero-brand__library-box">
        <span class="hero-brand__library">library</span>
      </span>
    </h1>

    <p class="hero-slogan">
      Para conseguir <mark class="hero-slogan__highlight">el habito de lectura</mark><br />
      y tener todos tus libros en un solo lugar
    </p>
  </div>

  <!-- Right Side: login.png and registrarse.png window cards -->
  <div class="home-card-col home-card-col--right">
    <div class="home-card-stack">
      <div class="home-card-item home-card-item--login">
        <bv-window-card
          title="login.png"
          src="/assets/images/Login.jpg"
          alt="Iniciar Sesión"
          routerLink="/login"
        />
      </div>

      <div class="home-card-item home-card-item--register">
        <bv-window-card
          title="registrarse.png"
          src="/assets/images/Registro.jpg"
          alt="Registrarse"
          routerLink="/registro"
        />
      </div>
    </div>
  </div>
</section>
