<bv-page-header
  title="Ruleta"
  subtitle="Gira la ruleta para descubrir tu próxima lectura al azar del catálogo."
/>

<div class="roulette">
  <div class="roulette__wheel" [class.roulette__wheel--spinning]="spinning()" aria-hidden="true">
    <span class="roulette__glyph">?</span>
  </div>

  <button type="button" class="bv-btn" [disabled]="spinning()" (click)="spin()">
    {{ spinning() ? 'Girando…' : 'Girar la ruleta' }}
  </button>

  <p class="bv-muted roulette__note">
    El sorteo elegirá un libro de nuestra biblioteca para inspirar tu hábito de lectura.
  </p>
</div>

<bv-error-banner [error]="error()" />

@if (spinning()) {
  <bv-spinner label="Buscando un libro…" />
} @else if (result(); as book) {
  <div class="bv-card result">
    <p class="bv-badge bv-badge--success">¡Te ha tocado!</p>
    <h2>
      <a [routerLink]="['/libros', book.id]">{{ book.titulo }}</a>
    </h2>
    <p class="bv-muted">
      {{ book.descripcion || 'Descubre este libro en el catálogo.' }}
    </p>
    <div style="margin-top: 1rem;">
      <a [routerLink]="['/libros', book.id]" class="bv-btn">Ver detalle del libro</a>
    </div>
  </div>
}
