<!-- Overview Mode (matches Biblioteca.svg) -->
<div class="vl-panel">
  <div class="vl-panel__top-bar">
    <span class="vl-back-title">
      <svg viewBox="0 0 24 24">
        <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span>Biblioteca</span>
    </span>
  </div>

  <!-- Button: Ingresar a toda la biblioteca con icono libro-alt.svg -->
  <button type="button" class="vl-btn-gold" (click)="browse.emit()">
    <img src="/assets/images/libro-alt.svg" alt="" aria-hidden="true" class="vl-btn-gold__icon" />
    <span>Ingresar a toda la biblioteca</span>
  </button>

  <form class="vl-search-group" (ngSubmit)="search()" novalidate>
    <!-- Al tocar "Buscar" se despliegan los campos de título y autor -->
    <button
      type="button"
      class="vl-btn-gold vl-search-toggle"
      aria-controls="vl-search-fields"
      [attr.aria-expanded]="searchOpen()"
      (click)="toggleSearch()"
    >
      <img src="/assets/images/busqueda.svg" alt="" aria-hidden="true" />
      <span>Buscar por título o autor</span>
      <svg
        class="vl-chevron-icon"
        [class.vl-chevron-icon--open]="searchOpen()"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <polyline points="6 9 12 15 18 9" stroke="currentColor" stroke-width="2.5" fill="none" />
      </svg>
    </button>

    @if (searchOpen()) {
      <div id="vl-search-fields" class="vl-search-fields">
        <!-- Search by Title con icono busqueda.svg -->
        <div class="vl-field">
          <label for="bookTitle">Búsqueda por título:</label>
          <div class="vl-input-wrap">
            <img
              src="/assets/images/busqueda.svg"
              class="vl-input-icon"
              alt=""
              aria-hidden="true"
            />
            <input
              id="bookTitle"
              name="bookTitle"
              type="search"
              [ngModel]="filters().title()"
              (ngModelChange)="filters().title.set($event)"
              placeholder="Ingrese el título"
            />
          </div>
        </div>

        <!-- Search by Author con icono usuario.svg -->
        <div class="vl-field">
          <label for="bookAuthor">Búsqueda por autor:</label>
          <div class="vl-input-wrap">
            <img src="/assets/images/usuario.svg" class="vl-input-icon" alt="" aria-hidden="true" />
            <input
              id="bookAuthor"
              name="bookAuthor"
              type="search"
              [ngModel]="filters().author()"
              (ngModelChange)="filters().author.set($event)"
              placeholder="Ingrese autor"
            />
          </div>
        </div>

        <button type="submit" class="vl-btn vl-btn--primary vl-search-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-3.5-3.5" stroke-linecap="round" />
          </svg>
          <span>Buscar</span>
        </button>
      </div>
    }

    <!-- Search / Filter by Category (matches Categorias.svg) -->
    <div class="vl-field">
      <label>Búsqueda por categoría:</label>
      <div class="vl-category-dropdown">
        <button
          type="button"
          class="vl-category-trigger"
          (click)="categoryOpen.set(!categoryOpen())"
          [attr.aria-expanded]="categoryOpen()"
        >
          <svg
            class="vl-chevron-icon"
            [class.vl-chevron-icon--open]="categoryOpen()"
            viewBox="0 0 24 24"
          >
            <polyline
              points="6 9 12 15 18 9"
              stroke="currentColor"
              stroke-width="2.5"
              fill="none"
            />
          </svg>
          <span>{{ filters().category() || 'Categorías' }}</span>
        </button>

        @if (categoryOpen()) {
          <div class="vl-category-menu">
            @for (cat of categories(); track cat) {
              <button
                type="button"
                class="vl-category-item"
                [class.vl-category-item--active]="filters().category() === cat"
                (click)="selectCategory(cat)"
              >
                {{ cat }}
              </button>
            }
            @if (categories().length === 0) {
              <div class="vl-category-item vl-category-item--empty">Sin categorías disponibles</div>
            }
          </div>
        }
      </div>
    </div>
  </form>
</div>
