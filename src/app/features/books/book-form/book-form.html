<div class="vl-page-layout">
  <div class="vl-title-row">
    <h1 class="vl-highlight-title">{{ isEditing() ? 'Editar Libro' : 'Libros' }}</h1>
  </div>

  <div class="vl-content-grid">
    <!-- Left Column: Form Panel -->
    <div class="vl-form-col">
      <div class="vl-panel">
        <a routerLink="/libros" class="vl-back-title">
          <svg viewBox="0 0 24 24">
            <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>{{ isEditing() ? 'Editar libro' : 'Agregar libro a la biblioteca' }}</span>
        </a>

        <bv-error-banner [error]="error()" />
        <bv-error-banner [error]="categories.error()" />

        @if (loading()) {
          <bv-spinner label="Cargando libro…" />
        } @else {
          <form (ngSubmit)="submit()" novalidate class="book-form">
            <div class="vl-field">
              <label for="titulo">Título del libro: *</label>
              <div class="vl-input-wrap">
                <input
                  id="titulo"
                  name="titulo"
                  type="text"
                  [(ngModel)]="form.titulo"
                  placeholder="Ej: Cien años de soledad"
                  required
                />
              </div>
            </div>

            <bv-author-picker [(selected)]="selectedAuthors" (failed)="error.set($event)" />

            <!-- Categoría (con alta de categorías nuevas) y ubicación -->
            <div class="form-row-2">
              <div class="vl-field">
                <label for="categoria">Categoría: *</label>
                <div class="vl-input-wrap">
                  <select
                    id="categoria"
                    name="categoria"
                    [ngModel]="categories.selected()"
                    (ngModelChange)="categories.change($event)"
                    class="vl-select"
                    required
                  >
                    @for (cat of categories.all(); track cat.id) {
                      <option [value]="cat.id.toString()">{{ cat.nombre }}</option>
                    }
                    @if (categories.all().length === 0) {
                      <option value="1">General</option>
                    }
                    <option [value]="categories.newOption">+ Agregar categoría…</option>
                  </select>
                </div>
              </div>

              <div class="vl-field">
                <label for="ubicacion">Ubicación: *</label>
                <div class="vl-input-wrap">
                  <select
                    id="ubicacion"
                    name="ubicacion"
                    [(ngModel)]="form.ubicacion"
                    class="vl-select"
                    required
                  >
                    @for (location of locations; track location.value) {
                      <option [value]="location.value">{{ location.label }}</option>
                    }
                  </select>
                </div>
              </div>
            </div>

            @if (categories.adding()) {
              <div class="inline-add">
                <div class="vl-field">
                  <label for="nuevaCategoria">Nueva categoría:</label>
                  <div class="vl-input-wrap">
                    <input
                      id="nuevaCategoria"
                      name="nuevaCategoria"
                      type="text"
                      maxlength="100"
                      [ngModel]="categories.newName()"
                      (ngModelChange)="categories.newName.set($event)"
                      placeholder="Ej: Poesía"
                      (keydown.enter)="$event.preventDefault(); categories.add()"
                    />
                  </div>
                </div>
                <button
                  type="button"
                  class="vl-btn vl-btn--primary"
                  [disabled]="categories.saving() || !categories.newName().trim()"
                  (click)="categories.add()"
                >
                  {{ categories.saving() ? 'Agregando…' : 'Agregar' }}
                </button>
                <button type="button" class="vl-btn vl-btn--ghost" (click)="categories.cancel()">
                  Cancelar
                </button>
              </div>
            }

            @if (form.ubicacion === 'web') {
              <div class="vl-field">
                <label for="url_lectura">URL donde lo estás leyendo: *</label>
                <div class="vl-input-wrap">
                  <input
                    id="url_lectura"
                    name="url_lectura"
                    type="url"
                    maxlength="500"
                    [(ngModel)]="form.url_lectura"
                    placeholder="https://..."
                    required
                  />
                </div>
              </div>
            }

            <!-- Páginas totales y leídas -->
            <div class="form-row-2">
              <div class="vl-field">
                <label for="paginas_totales">Páginas totales:</label>
                <div class="vl-input-wrap">
                  <input
                    id="paginas_totales"
                    name="paginas_totales"
                    type="number"
                    min="0"
                    [(ngModel)]="form.paginas_totales"
                    placeholder="Ej: 350"
                  />
                </div>
              </div>

              <div class="vl-field">
                <label for="paginas_leidas">Páginas leídas:</label>
                <div class="vl-input-wrap">
                  <input
                    id="paginas_leidas"
                    name="paginas_leidas"
                    type="number"
                    min="0"
                    [(ngModel)]="form.paginas_leidas"
                    placeholder="Ej: 140"
                  />
                </div>
              </div>
            </div>

            <!-- Previsualización del porcentaje -->
            <div class="reading-progress-preview">
              <div class="reading-progress-preview__bar">
                <div class="reading-progress-preview__fill" [style.width.%]="percentage"></div>
              </div>
              <span class="reading-progress-preview__label">
                Progreso calculado: <strong>% {{ percentage }}</strong>
              </span>
            </div>

            <bv-book-cover-picker [(path)]="cover" [(uploading)]="uploadingCover" />

            <div class="vl-field">
              <label for="descripcion">Notas / Descripción:</label>
              <div class="vl-input-wrap">
                <textarea
                  id="descripcion"
                  name="descripcion"
                  [(ngModel)]="form.descripcion"
                  placeholder="Escribe notas o descripción del libro..."
                  rows="3"
                  class="vl-textarea"
                ></textarea>
              </div>
            </div>
          </form>
        }
      </div>

      <!-- Action Folder Buttons -->
      <div class="vl-folder-actions">
        <bv-folder-button
          [label]="isEditing() ? 'Guardar' : 'Agregar libro'"
          type="submit"
          [disabled]="submitting() || loading() || uploadingCover()"
          (clicked)="submit()"
        />
        <bv-folder-button
          label="Cancelar"
          routerLink="/libros"
        />
      </div>
    </div>

    <!-- Right Column: Window Card with Biblioteca.jpg -->
    <div class="vl-image-col">
      <bv-window-card
        title="biblioteca.png"
        src="/assets/images/Biblioteca.jpg"
        alt="Biblioteca"
      />
    </div>
  </div>
</div>
