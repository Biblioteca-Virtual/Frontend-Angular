<div class="vl-page-layout">
  <div class="vl-title-row">
    <h1 class="vl-highlight-title">Biblioteca</h1>
  </div>

  <div class="vl-content-grid">
    <!-- Left Column: Search & Overview OR Complete Library Grid -->
    <div class="vl-form-col">
      @if (viewMode() === 'overview') {
        <bv-book-search-panel
          [filters]="filters"
          [categories]="categories()"
          (browse)="viewMode.set('complete')"
        />

        <!-- Collections Section with Blue Folder Buttons -->
        <div class="collections-section">
          <h2 class="collections-title vl-glass">
            <a routerLink="/colecciones">Colecciones</a>
          </h2>
          <div class="vl-folder-actions">
            @for (collection of collections.data() ?? []; track collection.id) {
              <bv-folder-button
                [label]="collection.nombre"
                [routerLink]="['/colecciones', collection.id]"
              />
            }
            <bv-folder-button label="Agregar colección" routerLink="/colecciones" />
            <bv-folder-button
              label="Agregar libro"
              routerLink="/libros/nuevo"
            />
          </div>
        </div>
      } @else {
        <bv-book-grid
          [books]="filteredBooks()"
          [filters]="filters"
          [loading]="state.isInitialLoading()"
          [error]="state.error()"
          (back)="viewMode.set('overview')"
        />
      }
    </div>

    <!-- Right Column: Window Card with Biblioteca.jpg -->
    <div class="vl-image-col">
      <bv-window-card
        title="biblioteca.png"
        src="/assets/images/Biblioteca.jpg"
        alt="Interior Biblioteca"
      />
    </div>
  </div>
</div>
