# nginx para la app Angular compilada.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas de Angular (/books/3, /verify-session?...): si no existe el archivo,
    # se devuelve index.html y el router de Angular resuelve la ruta.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html sin caché, para que siempre cargue la última versión publicada.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
